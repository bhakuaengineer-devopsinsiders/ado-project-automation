trigger: none
pr: none

parameters:
  - name: organization
    displayName: 'Azure DevOps Organization'
    type: string
    default: 'costcocloudops1'
    values:
      - costcocloudops1
      - CostcoWholesale11

  - name: projectName
    displayName: 'Azure DevOps Project Name'
    type: string
    default: 'My-New-Project'

variables:
  - group: ADO-Secrets

pool:
  vmImage: ubuntu-latest

stages:
  # ------------------------------------------------------------------
  # STAGE 1: Manual approval required only for 'CostcoWholesale11'
  # ------------------------------------------------------------------
  - stage: ApproveCostcoWholesale
    displayName: 'Manual Approval (CostcoWholesale11)'
    condition: eq('${{ parameters.organization }}', 'CostcoWholesale11')
    jobs:
      - job: WaitForApproval
        displayName: 'Awaiting Manual Approval'
        pool: server
        timeoutInMinutes: 1440 # 24 hours
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: ''
              instructions: 'Project creation in the "CostcoWholesale11" organization requires manual approval. Please review the project details and approve or reject.'

  # ------------------------------------------------------------------
  # STAGE 2: Create Project (Direct for costcocloudops1, Post-Approval for CostcoWholesale11)
  # ------------------------------------------------------------------
  - stage: CreateProject
    displayName: 'Create Azure DevOps Project'
    dependsOn: ApproveCostcoWholesale
    condition: in(dependencies.ApproveCostcoWholesale.result, 'Succeeded', 'Skipped')

    jobs:
      - job: CreateADOProject
        displayName: 'Validate and Create Project'

        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: 'Check and Create Azure DevOps Project'
            inputs:
              targetType: filePath
              filePath: '$(Build.SourcesDirectory)/scripts/create-ado-project.ps1'
              arguments: '-Organization "${{ parameters.organization }}" -ProjectName "${{ parameters.projectName }}"'
              pwsh: true
            env:
              ${{ if eq(parameters.organization, 'costcocloudops1') }}:
                ADO_PAT: $(ADO_PAT_COSTCOCLOUDOPS1)
              ${{ if eq(parameters.organization, 'CostcoWholesale11') }}:
                ADO_PAT: $(ADO_PAT_COSTCOWHOLESALE11)
              ADO_PAT_FALLBACK: $(ADO_PAT)
