trigger: none
pr: none

parameters:
  - name: organization
    displayName: 'Azure DevOps Organization'
    type: string
    default: 'devopsinsiders'
    values:
      - devopsinsiders
      - VistaraTechnologies

  - name: existingProjectName
    displayName: 'Existing Project Name'
    type: string
    default: 'My-Old-Project'

  - name: newProjectName
    displayName: 'New Project Name'
    type: string
    default: 'My-New-Project'

variables:
  - group: ADO-Secrets

pool:
  vmImage: ubuntu-latest

stages:
  # ------------------------------------------------------------------
  # STAGE 1: Manual approval required only for 'devopsinsiders'
  # ------------------------------------------------------------------
  - stage: ApproveDevopsinsiders
    displayName: 'Manual Approval (devopsinsiders)'
    condition: eq('${{ parameters.organization }}', 'devopsinsiders')
    jobs:
      - job: WaitForApproval
        displayName: 'Awaiting Manual Approval'
        pool: server
        timeoutInMinutes: 1440 # 24 hours
        steps:
          - task: ManualValidation@0
            inputs:
              notifyUsers: ''
              instructions: 'Project rename in the "devopsinsiders" organization requires manual approval. Please review the details and approve or reject.'

  # ------------------------------------------------------------------
  # STAGE 2: Rename Project (Direct for VistaraTechnologies, Post-Approval for devopsinsiders)
  # ------------------------------------------------------------------
  - stage: RenameProject
    displayName: 'Rename Azure DevOps Project'
    dependsOn: ApproveDevopsinsiders
    condition: in(dependencies.ApproveDevopsinsiders.result, 'Succeeded', 'Skipped')

    jobs:
      - job: RenameADOProject
        displayName: 'Validate and Rename Project'

        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: 'Validate and Rename Azure DevOps Project'
            inputs:
              targetType: filePath
              filePath: '$(Build.SourcesDirectory)/scripts/rename-ado-project.ps1'
              arguments: '-Organization "${{ parameters.organization }}" -ExistingProjectName "${{ parameters.existingProjectName }}" -NewProjectName "${{ parameters.newProjectName }}"'
              pwsh: true
            env:
              ${{ if eq(parameters.organization, 'devopsinsiders') }}:
                ADO_PAT: $(ADO_PAT_DEVOPSINSIDERS)
              ${{ if eq(parameters.organization, 'VistaraTechnologies') }}:
                ADO_PAT: $(ADO_PAT_VISTARATECHNOLOGIES)
